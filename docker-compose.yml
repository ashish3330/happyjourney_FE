version: '3.8'

services:
  frontend:
    build: .
    container_name: railfood-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /root/railfood-main1/webroot:/usr/share/nginx/html/.well-known/acme-challenge # Match Certbot webroot
      - /etc/letsencrypt:/etc/letsencrypt:ro # Mount certificates
    restart: unless-stopped