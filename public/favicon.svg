<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="plateShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ccfbf1" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- ── Icon background (rounded square) ── -->
  <rect x="2" y="8" width="48" height="48" rx="13" fill="url(#iconBg)"/>

  <!-- ── Steam wisps ── -->
  <path d="M 17 25 C 15.5 22 18.5 19 17 16" stroke="white" stroke-width="1.6" stroke-linecap="round" opacity="0.72"/>
  <path d="M 26 23 C 24.5 20 27.5 17 26 14" stroke="white" stroke-width="1.6" stroke-linecap="round" opacity="0.72"/>
  <path d="M 35 25 C 33.5 22 36.5 19 35 16" stroke="white" stroke-width="1.6" stroke-linecap="round" opacity="0.72"/>

  <!-- ── Dome handle ── -->
  <rect x="23" y="26" width="6" height="4.5" rx="2.25" fill="url(#plateShine)"/>

  <!-- ── Cloche dome ── -->
  <path d="M 11 44 Q 11 30 26 30 Q 41 30 41 44 Z" fill="url(#plateShine)"/>

  <!-- ── Base plate ── -->
  <rect x="9" y="44" width="34" height="4.5" rx="2.25" fill="white" opacity="0.92"/>

  <!-- ── Fork tine accent (right side of dome) ── -->
  <line x1="44" y1="33" x2="44" y2="48" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
  <line x1="46.5" y1="33" x2="46.5" y2="48" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
  <path d="M 44 33 Q 45.25 30 46.5 33" stroke="white" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- ── Brand name ── -->
  <text x="62" y="33"
    font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    font-weight="800"
    letter-spacing="-0.4"
    fill="#134e4a">Happy<tspan fill="#0d9488">Journey</tspan>
  </text>

  <!-- ── Dot separator / accent line ── -->
  <rect x="62" y="37" width="148" height="1.5" rx="0.75" fill="#ccfbf1"/>

  <!-- ── Slogan ── -->
  <text x="63" y="52"
    font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="10"
    font-weight="600"
    letter-spacing="1.4"
    fill="#0f766e">SIZZLING MEAL TO DOORSTEP</text>
</svg>
