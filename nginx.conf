# HTTP server (redirects to HTTPS)
server {
  listen 80;
  listen [::]:80;  # Support IPv6
  server_name thehappyjourneyy.com www.thehappyjourneyy.com;

  # Redirect all HTTP traffic to HTTPS
  return 301 https://$host$request_uri;
}

# HTTPS server
server {
  listen 443 ssl;
  server_name thehappyjourneyy.com www.thehappyjourneyy.com;

  # SSL certificate paths (adjust paths if certificates are copied into the container)
  ssl_certificate /etc/letsencrypt/live/thehappyjourneyy.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/thehappyjourneyy.com/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  # Handle SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Media: images, icons, video, audio, HTC
  location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
    expires 1M;
    access_log off;
    add_header Cache-Control "public";
  }

  # CSS and Javascript
  location ~* \.(?:css|js)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public";
  }
}